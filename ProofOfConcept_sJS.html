<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive OCR Tester v2.0 - Multi-Page PDF Support</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
body { display: flex; overflow: hidden; }
#preview { width: 50%; border-right: 1px solid #ccc; overflow: auto; padding: 10px; box-sizing: border-box; height: 100vh; position: relative; }
#output { width: 50%; padding: 10px; box-sizing: border-box; overflow-y: auto; height: 100vh; }
canvas { max-width: 100%; max-height: 70vh; border: 1px solid #999; display: block; margin-bottom: 10px; cursor: crosshair; }
.field { margin-bottom: 10px; }
.field label { font-weight: bold; }
textarea { width: 100%; box-sizing: border-box; }

.ocrField {
  display: inline-block;
  min-width: 120px;
  min-height: 20px;
  border: 1px solid #999;
  padding: 2px 4px;
  margin-left: 6px;
  cursor: pointer;
  background-color: #f9f9f9;
}
.ocrField.active {
  border-width: 2px;
}

#pageNav {
  margin: 10px 0;
  padding: 10px;
  background: #f0f0f0;
  border-radius: 4px;
}

#pageNav button {
  padding: 8px 16px;
  margin: 0 5px;
  cursor: pointer;
  border: 1px solid #666;
  background: white;
  border-radius: 4px;
}

#pageNav button:hover {
  background: #e0e0e0;
}

#pageNav button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#pageInfo {
  margin: 0 10px;
  font-weight: bold;
}

.status {
  padding: 10px;
  margin: 10px 0;
  border-radius: 4px;
  background: #e3f2fd;
  color: #1565c0;
}

.error {
  background: #ffebee;
  color: #c62828;
}

.success {
  background: #e8f5e9;
  color: #2e7d32;
}
</style>
</head>
<body>

<div id="preview">
  <input type="file" id="imgInput" accept="image/*,application/pdf"><br>
  <div id="status" class="status" style="display:none;"></div>
  <div id="pageNav" style="display:none;">
    <button id="prevPage">← Previous</button>
    <span id="pageInfo">Page 1 of 1</span>
    <button id="nextPage">Next →</button>
    <button id="ocrAllPages" style="margin-left: 20px;">OCR All Pages</button>
  </div>
  <canvas id="canvas"></canvas>
</div>

<div id="output">
  <h3>Extracted Fields</h3>
  <div class="field"><label>Kunden-Nr:</label> <span id="kundennr" class="ocrField" data-key="kundennr">[click to mark]</span></div>
  <div class="field"><label>Rechnungs-Nr:</label> <span id="rechnungsnr" class="ocrField" data-key="rechnungsnr">[click to mark]</span></div>
  <div class="field"><label>Datum:</label> <span id="datum" class="ocrField" data-key="datum">[click to mark]</span></div>
  <div class="field"><label>Gesamtbetrag:</label> <span id="gesamtbetrag" class="ocrField" data-key="gesamtbetrag">[click to mark]</span></div>
  
  <h3>Full Text (Current Page)</h3>
  <div><textarea id="fullText" rows="20"></textarea></div>
  
  <h3>All Pages Combined Text</h3>
  <div><textarea id="allPagesText" rows="10"></textarea></div>
</div>

<script type="module">
import scribe from 'https://cdn.jsdelivr.net/npm/scribe.js-ocr@0.9.0/scribe.js';

// Initialize Scribe with CDN paths
await scribe.init({ 
  workerPath: 'https://cdn.jsdelivr.net/npm/scribe.js-ocr@0.9.0/lib/',
});

let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let img = new Image();
let ocrText = "";
let allPagesOcrText = ""; // Combined text from all pages
let activeField = null;
let marks = {}; // fieldKey -> {color, boxes[]}

// Multi-page PDF support
let currentPage = 1;
let totalPages = 1;
let pdfPages = []; // Array of image data for each page
let isPDF = false;

function randomColor() { return '#' + Math.floor(Math.random()*16777215).toString(16); }

function showStatus(message, type = 'status') {
    const statusEl = document.getElementById('status');
    statusEl.textContent = message;
    statusEl.className = `status ${type}`;
    statusEl.style.display = 'block';
}

function hideStatus() {
    document.getElementById('status').style.display = 'none';
}

document.getElementById('imgInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    
    showStatus('Loading file...', 'status');
    
    // Reset state
    currentPage = 1;
    totalPages = 1;
    pdfPages = [];
    isPDF = file.type === 'application/pdf';
    allPagesOcrText = "";
    document.getElementById('allPagesText').value = "";
    
    if (isPDF) {
        // Use Scribe.js to process PDF
        try {
            showStatus('Processing PDF with Scribe.js...', 'status');
            
            // Scribe.js recognizes PDFs and returns page-by-page results
            const result = await scribe.extractText([file], {
                langs: ['deu', 'eng'],
                progress: (progress) => {
                    showStatus(`OCR Progress: ${Math.round(progress.progress * 100)}%`, 'status');
                }
            });
            
            console.log("Scribe.js PDF result:", result);
            
            // Extract pages from Scribe.js result
            if (result && result.pages && result.pages.length > 0) {
                totalPages = result.pages.length;
                
                // Process each page
                for (let i = 0; i < result.pages.length; i++) {
                    const page = result.pages[i];
                    
                    // Get page image (Scribe.js provides canvas data)
                    const pageCanvas = page.canvas || page.image;
                    if (pageCanvas) {
                        pdfPages.push({
                            canvas: pageCanvas,
                            text: page.text || '',
                            index: i
                        });
                    }
                    
                    // Accumulate text from all pages
                    if (page.text) {
                        allPagesOcrText += `\n--- Page ${i + 1} ---\n${page.text}\n`;
                    }
                }
                
                document.getElementById('allPagesText').value = allPagesOcrText.trim();
                
                // Show first page
                if (pdfPages.length > 0) {
                    displayPage(0);
                    document.getElementById('pageNav').style.display = 'block';
                    updatePageInfo();
                    showStatus(`PDF loaded: ${totalPages} pages`, 'success');
                }
            } else {
                showStatus('Failed to extract pages from PDF', 'error');
            }
        } catch (error) {
            console.error("Scribe.js error:", error);
            showStatus(`Error processing PDF: ${error.message}`, 'error');
        }
    } else {
        // Handle regular image file
        document.getElementById('pageNav').style.display = 'none';
        const reader = new FileReader();
        reader.onload = evt => { 
            img.src = evt.target.result; 
        };
        reader.readAsDataURL(file);
    }
});

// Display specific PDF page
function displayPage(pageIndex) {
    if (!isPDF || pageIndex < 0 || pageIndex >= pdfPages.length) return;
    
    const page = pdfPages[pageIndex];
    const pageCanvas = page.canvas;
    
    // Draw page canvas to main canvas
    const maxHeight = window.innerHeight * 0.7;
    const scale = Math.min(1, maxHeight / pageCanvas.height);
    canvas.width = pageCanvas.width * scale;
    canvas.height = pageCanvas.height * scale;
    
    // Copy page image to display canvas
    ctx.drawImage(pageCanvas, 0, 0, canvas.width, canvas.height);
    
    // Set OCR text for this page
    ocrText = page.text || '';
    document.getElementById('fullText').value = ocrText;
    parseFields(ocrText);
    
    currentPage = pageIndex + 1;
    updatePageInfo();
    redrawCanvas();
}

// Update page navigation info
function updatePageInfo() {
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevPage').disabled = currentPage <= 1;
    document.getElementById('nextPage').disabled = currentPage >= totalPages;
}

// Page navigation handlers
document.getElementById('prevPage').addEventListener('click', () => {
    if (currentPage > 1) {
        displayPage(currentPage - 2);
    }
});

document.getElementById('nextPage').addEventListener('click', () => {
    if (currentPage < totalPages) {
        displayPage(currentPage);
    }
});

document.getElementById('ocrAllPages').addEventListener('click', () => {
    // Combine and parse fields from all pages
    parseFields(allPagesOcrText);
    showStatus('Parsed fields from all pages combined', 'success');
    setTimeout(hideStatus, 3000);
});

// Handle regular image load
img.onload = async () => {
    const maxHeight = window.innerHeight * 0.7;
    const scale = Math.min(1, maxHeight / img.height);
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    showStatus('Running OCR with Scribe.js...', 'status');
    
    try {
        // Convert image to blob for Scribe.js
        const blob = await fetch(img.src).then(r => r.blob());
        
        const result = await scribe.extractText([blob], {
            langs: ['deu', 'eng'],
            progress: (progress) => {
                showStatus(`OCR Progress: ${Math.round(progress.progress * 100)}%`, 'status');
            }
        });
        
        console.log("Scribe.js image result:", result);
        
        if (result && result.text) {
            ocrText = result.text;
            document.getElementById('fullText').value = ocrText;
            parseFields(ocrText);
            showStatus('OCR complete!', 'success');
            setTimeout(hideStatus, 2000);
        } else {
            showStatus('OCR returned no text', 'error');
        }
    } catch (error) {
        console.error("Scribe.js error:", error);
        showStatus(`OCR error: ${error.message}`, 'error');
    }
};

function parseFields(text) {
    function extractField(keywords) {
        for (let kw of keywords) {
            const regex = new RegExp(kw + "\\s*[:\\-\\.]*\\s*([0-9A-Za-z.,/-]+)", "i");
            const match = text.match(regex);
            if (match) return match[1];
        }
        return "[click to mark]";
    }

    document.getElementById('kundennr').innerText = extractField(["Kunden-Nr","KundenNr"]);
    document.getElementById('rechnungsnr').innerText = extractField(["Rechnungs-Nr","Rech-Nr","Invoice Nr","Rechnungs-Nr.: "]);
    document.getElementById('datum').innerText = extractField(["Datum","Date"]);
    document.getElementById('gesamtbetrag').innerText = extractField(["Gesamtbetrag","Nettosumme","Endbetrag"]);

    console.log("Parsed fields:", {
        kundennr: document.getElementById('kundennr').innerText,
        rechnungsnr: document.getElementById('rechnungsnr').innerText,
        datum: document.getElementById('datum').innerText,
        gesamtbetrag: document.getElementById('gesamtbetrag').innerText
    });
}

// Run OCR on a specific region (surgical OCR)
async function runOCR(rect, callback) {
    console.log("Running surgical OCR on region:", rect);
    
    try {
        // Create cropped canvas
        const cropCanvas = document.createElement('canvas');
        const cropCtx = cropCanvas.getContext('2d');
        cropCanvas.width = rect.width;
        cropCanvas.height = rect.height;
        
        // Get source canvas (either main img or current PDF page)
        let sourceImage;
        if (isPDF && pdfPages.length > 0) {
            sourceImage = pdfPages[currentPage - 1].canvas;
        } else {
            sourceImage = img;
        }
        
        cropCtx.drawImage(sourceImage, rect.left, rect.top, rect.width, rect.height, 0, 0, rect.width, rect.height);
        
        // Convert to blob
        const blob = await new Promise(resolve => cropCanvas.toBlob(resolve));
        
        showStatus('Running surgical OCR...', 'status');
        
        const result = await scribe.extractText([blob], {
            langs: ['deu', 'eng']
        });
        
        console.log("Surgical OCR result:", result);
        
        if (callback) {
            callback(result.text || '');
        }
        
        hideStatus();
    } catch (error) {
        console.error("Surgical OCR error:", error);
        showStatus(`Surgical OCR error: ${error.message}`, 'error');
    }
}

// ------------------- Mouse position helper -------------------
function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

// ------------------- Field click -------------------
document.querySelectorAll('.ocrField').forEach(span => {
    span.addEventListener('click', e => {
        document.querySelectorAll('.ocrField').forEach(f => {
            f.classList.remove('active');
            f.style.borderColor = '#999'; // reset non-active
        });

        activeField = e.target;
        activeField.classList.add('active');

        const key = activeField.dataset.key;
        if (!marks[key]) marks[key] = { color: randomColor(), boxes: [] };
        else marks[key].boxes = [];

        // set value box border to rectangle color
        activeField.style.borderColor = marks[key].color;

        console.log("Active field:", key, "color:", marks[key].color);
        redrawCanvas();
    });
});

// ------------------- Canvas drawing -------------------
let drawing=false, startX, startY;

canvas.addEventListener('mousedown', e => {
    if (!activeField) return;
    drawing = true;
    const pos = getMousePos(e);
    startX = pos.x;
    startY = pos.y;
});

canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    redrawCanvas();
    const pos = getMousePos(e);
    const x = pos.x;
    const y = pos.y;

    ctx.strokeStyle = marks[activeField.dataset.key].color;
    ctx.fillStyle = marks[activeField.dataset.key].color + '33'; // translucent fill
    ctx.lineWidth = 2;
    ctx.strokeRect(startX, startY, x-startX, y-startY);
    ctx.fillRect(startX, startY, x-startX, y-startY);
});

canvas.addEventListener('mouseup', e => {
    if (!drawing) return;
    drawing = false;
    const pos = getMousePos(e);
    const x = pos.x;
    const y = pos.y;

    // Get source dimensions
    let sourceWidth, sourceHeight;
    if (isPDF && pdfPages.length > 0) {
        const pageCanvas = pdfPages[currentPage - 1].canvas;
        sourceWidth = pageCanvas.width;
        sourceHeight = pageCanvas.height;
    } else {
        sourceWidth = img.width;
        sourceHeight = img.height;
    }

    const scaleX = sourceWidth / canvas.width;
    const scaleY = sourceHeight / canvas.height;
    const scaledRegion = {
        left: Math.min(startX, x) * scaleX,
        top: Math.min(startY, y) * scaleY,
        width: Math.abs(x - startX) * scaleX,
        height: Math.abs(y - startY) * scaleY
    };
    console.log("Marked region (image coords):", scaledRegion);

    marks[activeField.dataset.key].boxes.push(scaledRegion);

    runOCR(scaledRegion, text => { 
        activeField.innerText = text.trim() || "[click to mark]"; 

        console.log("Updated field:", activeField.dataset.key, "=", activeField.innerText);
    });

    redrawCanvas();
});

// ------------------- Redraw canvas -------------------
function redrawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Redraw current image/page
    if (isPDF && pdfPages.length > 0) {
        const pageCanvas = pdfPages[currentPage - 1].canvas;
        ctx.drawImage(pageCanvas, 0, 0, canvas.width, canvas.height);
    } else if (img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
    
    // Get source dimensions for scaling
    let sourceWidth, sourceHeight;
    if (isPDF && pdfPages.length > 0) {
        const pageCanvas = pdfPages[currentPage - 1].canvas;
        sourceWidth = pageCanvas.width;
        sourceHeight = pageCanvas.height;
    } else {
        sourceWidth = img.width;
        sourceHeight = img.height;
    }
    
    // Draw all marked regions
    for (let key in marks) {
        ctx.strokeStyle = marks[key].color;
        ctx.fillStyle = marks[key].color + '33'; // translucent fill
        ctx.lineWidth = 2;
        marks[key].boxes.forEach(b => {
            const scaleX = canvas.width / sourceWidth;
            const scaleY = canvas.height / sourceHeight;
            ctx.strokeRect(b.left * scaleX, b.top * scaleY, b.width * scaleX, b.height * scaleY);
            ctx.fillRect(b.left * scaleX, b.top * scaleY, b.width * scaleX, b.height * scaleY);
        });
    }
}
</script>

</body>
</html>
