name: Backend tests (manual)

# NOTE: Temporarily disabled automatic triggers - fucking poppler does not run on linux
on:
  workflow_dispatch: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example

    env:
      MONGO_USER: root
      MONGO_PASS: example
      MONGO_HOST: localhost
      MONGO_PORT: 27017
      MONGO_DB: papertrail_test
      PORT: 4000
      NODE_ENV: development
      DEV_AUTH: 'true'
      JWT_SECRET: 'test-jwt-secret-for-ci'
      HMAC_SECRET: 'test-hmac-secret-for-ci'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Sharp for Linux
        run: npm rebuild sharp

      - name: Start backend server
        run: |
          echo "Starting backend server..."
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          echo "Server PID: $(cat server.pid)"
          sleep 3
          if ! ps -p $(cat server.pid) > /dev/null; then
            echo "ERROR: Server process died immediately after starting!"
            echo "=== Server Logs ==="
            cat server.log
            exit 1
          fi
          echo "Server process is running"

      - name: Wait for server to be healthy
        run: |
          echo 'Waiting for backend healthcheck...'
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/health || true)
            if [ "$status" = "200" ]; then
              echo "Server healthy"
              exit 0
            fi
            echo "Not ready yet (attempt $i/30, status=$status). Retrying..."
            sleep 2
          done
          echo "Server did not become healthy after 60 seconds"
          echo "=== Server Logs ==="
          cat server.log || echo "No server.log found"
          echo "=== Server Process ==="
          ps -p $(cat server.pid) || echo "Server process not running"
          exit 1

      - name: Run tests
        run: npm test

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          cat server.log || echo "No server.log found"

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
