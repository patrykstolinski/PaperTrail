name: Backend tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example

    env:
      MONGO_USER: root
      MONGO_PASS: example
      MONGO_HOST: localhost
      MONGO_PORT: 27017
      MONGO_DB: papertrail_test
      NODE_ENV: development
      DEV_AUTH: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start backend server
        run: |
          nohup node server.js > server.log 2>&1 & echo $! > server.pid

      - name: Wait for server to be healthy
        run: |
          echo 'Waiting for backend healthcheck...'
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/health || true)
            if [ "$status" = "200" ]; then
              echo "Server healthy"
              exit 0
            fi
            echo "Not ready yet (status=$status). Retrying..."
            sleep 2
          done
          echo "Server did not become healthy. Dumping server.log"
          tail -n +1 server.log || true
          exit 1

      - name: Run tests
        run: npm test --silent

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
